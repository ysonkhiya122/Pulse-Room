name: Scheduled News Ingestion

on:
  workflow_dispatch:

jobs:
  fetch:
    name: Ingest Topic Feeds
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Ingest Feeds & Validate Schema
        run: |
          echo "Simulated RSS feed fetch and Zod validation..."
          node -e "console.log('Feeds validated against EventTopic schema');"
