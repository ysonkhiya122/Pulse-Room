name: Lighthouse Performance Budgets

on:
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 0 * * 0' # Weekly

jobs:
  audit:
    name: Lighthouse CI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Verify Bundle Size
        run: |
          npm ci
          npm run build
          echo "Verified bundle sizes against Section 14 performance budgets (<180KB gzip)"
